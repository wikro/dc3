vrrp_track_process nginx {
	process nginx
	weight 0
}

vrrp_track_process java {
	process java
	weight 0
}

vrrp_instance vi {
	state MASTER #BACKUP
	interface ens18
	virtual_router_id 51
	priority 255 #254
	advert_int 1

	authentication {
		auth_type PASS
		auth_pass somepass
	}

	virtual_ipaddress {
		10.10.10.10/24
	}

	track_process {
		nginx
		java
	}
}
